name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Unpack source
        run: python3 -m zipfile -e "tadabbur_quran_v6 (1).zip" .
      - name: Write fixed app.dart
        run: |
          cat > lib/app.dart << 'DARTEOF'
          import 'package:flutter/material.dart';
          import 'package:flutter_localizations/flutter_localizations.dart';
          import 'package:flutter_bloc/flutter_bloc.dart';

          import 'core/constants/app_constants.dart';
          import 'core/router/app_router.dart';
          import 'core/theme/app_text_styles.dart';
          import 'core/theme/app_theme.dart';
          import 'features/settings/presentation/bloc/settings_cubit.dart';

          class TadabburApp extends StatelessWidget {
            const TadabburApp({super.key});

            @override
            Widget build(BuildContext context) {
              return BlocProvider(
                create: (_) => SettingsCubit(),
                child: Builder(
                  builder: (context) {
                    final settings = context.watch<SettingsCubit>().state;
                    return MaterialApp.router(
                      title: AppConstants.appName,
                      debugShowCheckedModeBanner: false,
                      builder: (context, child) => Directionality(
                        textDirection: TextDirection.rtl,
                        child: DefaultTextHeightBehavior(
                          textHeightBehavior: AppTextStyles.heightBehavior,
                          child: child ?? const SizedBox.shrink(),
                        ),
                      ),
                      locale: settings.locale,
                      supportedLocales: const [Locale('ku'), Locale('ar'), Locale('en')],
                      localizationsDelegates: const [
                        GlobalMaterialLocalizations.delegate,
                        GlobalWidgetsLocalizations.delegate,
                        GlobalCupertinoLocalizations.delegate,
                      ],
                      localeResolutionCallback: (deviceLocale, supported) {
                        if (deviceLocale == null) return const Locale('ar');
                        for (final l in supported) {
                          if (l.languageCode == deviceLocale.languageCode) {
                            return l.languageCode == 'ku' ? const Locale('ar') : l;
                          }
                        }
                        return const Locale('ar');
                      },
                      theme: AppTheme.lightTheme(context),
                      darkTheme: AppTheme.darkTheme(context),
                      themeMode: settings.themeMode,
                      routerConfig: AppRouter.router,
                    );
                  },
                ),
              );
            }
          }
          DARTEOF
      - name: Fetch fonts
        run: |
          mkdir -p assets/fonts
          BASE="https://raw.githubusercontent.com/google/fonts/main/ofl"
          curl -fL "$BASE/amiriquran/AmiriQuran-Regular.ttf" -o assets/fonts/UthmanicScriptKFGQPC-Regular.otf
          curl -fL "$BASE/amiri/Amiri-Regular.ttf" -o assets/fonts/UthmanicScriptKFGQPC-Bold.otf
          curl -fL "$BASE/vazirmatn/Vazirmatn%5Bwght%5D.ttf" -o assets/fonts/Kurdish-Regular.ttf
          cp assets/fonts/Kurdish-Regular.ttf assets/fonts/Kurdish-Bold.ttf
          curl -fL "$BASE/notosans/NotoSans%5Bwdth%2Cwght%5D.ttf" -o assets/fonts/NotoSans-Regular.ttf
          cp assets/fonts/NotoSans-Regular.ttf assets/fonts/NotoSans-Bold.ttf
      - run: flutter create --platforms=android --org com.tadabbur .
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: tadabbur-latest-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30
